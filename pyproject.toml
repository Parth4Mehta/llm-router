[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Route prompts across free-tier LLM APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools]
py-modules = [
    "capabilities",
    "cli",
    "health",
    "model_catalog",
    "providers",
    "router",
]